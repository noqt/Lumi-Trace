name: Try Lumi on synthetic Bandit SARIF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-synthetic-bandit-example:
    name: Build a verified reviewer queue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Generate a real Bandit SARIF report
        shell: bash
        working-directory: examples/bandit-demo/repository
        env:
          BANDIT_SARIF: ${{ github.workspace }}/.lumi-bandit-demo.sarif
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "bandit[sarif]==1.9.4"

          set +e
          bandit \
            --ignore-nosec \
            --tests B602 \
            --recursive . \
            --format sarif \
            --output "$BANDIT_SARIF"
          bandit_exit_code=$?
          set -e

          # One synthetic finding is the expected input, not a failed demo.
          test "$bandit_exit_code" -eq 1
          test -s "$BANDIT_SARIF"

      - id: lumi
        name: Turn Bandit's finding into a review queue
        uses: ./
        with:
          sarif: .lumi-bandit-demo.sarif
          repository: examples/bandit-demo/repository
          output: .lumi-trace-bandit-demo
          upload-artifact: "false"

      - name: Check the bounded synthetic result
        shell: bash
        env:
          LUMI_STATUS: ${{ steps.lumi.outputs.status }}
          LUMI_SELECTED: ${{ steps.lumi.outputs.selected-results }}
          LUMI_COMPLETED: ${{ steps.lumi.outputs.completed-localizations }}
          LUMI_REVIEW_PATHS: ${{ steps.lumi.outputs.unique-review-paths }}
        run: |
          set -euo pipefail
          test "$LUMI_STATUS" = complete
          test "$LUMI_SELECTED" = 1
          test "$LUMI_COMPLETED" = 1
          test "$LUMI_REVIEW_PATHS" = 1

      - name: Explain the result and invite feedback
        shell: bash
        env:
          LUMI_SELECTED: ${{ steps.lumi.outputs.selected-results }}
          LUMI_COMPLETED: ${{ steps.lumi.outputs.completed-localizations }}
          LUMI_REVIEW_PATHS: ${{ steps.lumi.outputs.unique-review-paths }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## What Lumi did"
            echo
            printf 'Bandit found **%s** synthetic issue. Lumi completed **%s** localisation and reduced it to **%s** review path: `app.py`.\n' \
              "$LUMI_SELECTED" "$LUMI_COMPLETED" "$LUMI_REVIEW_PATHS"
            echo
            echo "Scanner finding in. Focused review queue out. This walkthrough doesn't claim a real vulnerability exists."
            echo
            echo "## Tried it?"
            echo
            echo "Your public demo run:"
            echo "$RUN_URL"
            echo
            echo "Copy that link into the short Bandit demo result form, or tell us the exact blocker:"
            echo "https://github.com/noqt/Lumi-Trace/issues/new?template=bandit_demo_result.yml"
            echo
            echo "Don't include secrets, private paths, source, screenshots, raw logs, or live vulnerability details."
          } >> "$GITHUB_STEP_SUMMARY"
