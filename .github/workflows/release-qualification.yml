name: Qualify release source

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Exact full commit on main to qualify before signing a release tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-qualification-${{ inputs.source_revision }}
  cancel-in-progress: false

jobs:
  build:
    name: Build twice and compare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Bind qualification to an exact main commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
      - name: Install pinned build tools
        run: |
          python -m pip install --disable-pip-version-check \
            "build==1.3.0" "setuptools==83.0.0" "twine==6.1.0"
      - name: Build independent copies and require exact equality
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-a source-b raw-sdist-a raw-sdist-b dist-a dist-b dist
          git archive "$SOURCE_REVISION" | tar -x -C source-a
          git archive "$SOURCE_REVISION" | tar -x -C source-b
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REVISION")"
          export PYTHONHASHSEED=0 PIP_NO_INDEX=1
          for copy in a b; do
            (
              cd "source-$copy"
              python -m build --no-isolation --wheel --outdir "../dist-$copy"
              python -m build --no-isolation --sdist --outdir "../raw-sdist-$copy"
            )
            raw_sdist="$(find "raw-sdist-$copy" -maxdepth 1 -name '*.tar.gz' -print -quit)"
            python "source-$copy/scripts/normalize_step1_sdist.py" \
              --input "$raw_sdist" \
              --output "dist-$copy/$(basename "$raw_sdist")"
            python -m twine check "dist-$copy"/*.whl "dist-$copy"/*.tar.gz
          done
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          sdist_a="$(find dist-a -maxdepth 1 -name '*.tar.gz' -print -quit)"
          sdist_b="$(find dist-b -maxdepth 1 -name '*.tar.gz' -print -quit)"
          cmp --silent "$wheel_a" "$wheel_b"
          cmp --silent "$sdist_a" "$sdist_b"
          cp "$wheel_a" "$sdist_a" dist/
          (
            cd dist
            sha256sum *.whl *.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("dist")
          files = []
          for path in sorted(p for p in root.iterdir() if p.name != "qualification.json"):
              files.append(
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )
          receipt = {
              "schema_version": 1,
              "source_revision": os.environ["SOURCE_REVISION"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "independent_builds_equal": True,
              "files": files,
          }
          (root / "qualification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-${{ inputs.source_revision }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  clean-install:
    name: Clean install ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-qualification-${{ inputs.source_revision }}
          path: dist
      - name: Install the qualified wheel without dependencies
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --disable-pip-version-check --no-index --no-deps "$wheel"
      - name: Run and verify the synthetic walkthrough
        shell: bash
        run: |
          set -euo pipefail
          lumi-trace version > version.json
          lumi-trace trace \
            --finding examples/quickstart/finding.json \
            --finding-format manual \
            --repository examples/quickstart/repository \
            --output smoke-output
          lumi-trace verify smoke-output > verify.json
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path("version.json").read_text(encoding="utf-8"))
          verified = json.loads(Path("verify.json").read_text(encoding="utf-8"))
          candidates = json.loads(
              Path("smoke-output/candidates.json").read_text(encoding="utf-8")
          )
          bundle = json.loads(
              Path("smoke-output/evidence-bundle.json").read_text(encoding="utf-8")
          )
          top = candidates["candidates"][0]
          receipt = {
              "schema_version": 1,
              "package_version": version["version"],
              "inventory_id": version["inventory_id"],
              "model_status": version["model_status"],
              "verified": verified["valid"],
              "ranking_algorithm": candidates["algorithm"],
              "candidate_algorithm": candidates["candidate_algorithm"],
              "top_path": top["path"],
              "top_symbol": top["symbol"]["name"],
              "top_rank": top["rank"],
              "classification": bundle["classification"]["outcome"],
              "reason_codes": bundle["classification"]["reason_codes"],
          }
          assert receipt["package_version"] == "0.10.1"
          assert receipt["verified"] is True
          assert receipt["top_path"] == "src/archive.py"
          assert receipt["top_symbol"] == "extraction_target"
          assert receipt["top_rank"] == 1
          assert receipt["classification"] == "INSUFFICIENT_EVIDENCE"
          assert receipt["reason_codes"] == ["NO_REPRODUCTION_PLAN"]
          Path("semantic-receipt.json").write_bytes(
              (json.dumps(receipt, indent=2, sort_keys=True) + "\n").encode("utf-8")
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.os }}-py${{ matrix.python-version }}
          path: semantic-receipt.json
          if-no-files-found: error
          retention-days: 1

  compare-clean-installs:
    name: Require identical clean-install semantics
    needs: clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*
          path: receipts
      - name: Compare all four semantic receipts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' receipts < <(find receipts -name semantic-receipt.json -print0)
          test "${#receipts[@]}" -eq 4
          reference="${receipts[0]}"
          for receipt in "${receipts[@]:1}"; do
            cmp --silent "$reference" "$receipt"
          done
          cat "$reference"
