name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
      - name: Install project and development checks
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test deterministic runtime
        run: python -m pytest -q -m "not docker"
      - name: Check licences
        run: python scripts/check_licenses.py
      - name: Check secrets
        run: python scripts/check_secrets.py
      - name: Check dependencies
        run: python scripts/check_dependencies.py
      - name: Check public boundary
        run: python scripts/check_public_boundary.py

  quality:
    name: Package and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip_audit --skip-editable --progress-spinner off
      - run: python -m build
      - run: python -m twine check dist/*

  sandbox:
    name: Network-denied OCI qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Preload immutable Alpine fixture image
        run: docker pull alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
      - name: Qualify network-denied sandbox
        env:
          LUMI_TRACE_TEST_IMAGE: alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
        run: python -m pytest -q -m docker
