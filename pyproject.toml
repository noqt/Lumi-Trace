[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark-lumi-trace"
version = "0.8.0"
description = "Local vulnerability localisation and evidence for known security findings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Skylark.AI" }]
keywords = ["sarif", "security", "vulnerability", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/noqt/Lumi-Trace"
Documentation = "https://github.com/noqt/Lumi-Trace/tree/main/docs"
Repository = "https://github.com/noqt/Lumi-Trace"
Issues = "https://github.com/noqt/Lumi-Trace/issues"
Changelog = "https://github.com/noqt/Lumi-Trace/blob/main/CHANGELOG.md"
Releases = "https://github.com/noqt/Lumi-Trace/releases"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "jsonschema==4.26.0",
  "packaging==26.2",
  "pip-audit==2.9.0",
  "PyYAML==6.0.3",
  "pytest==9.0.3",
  "ruff==0.12.3",
  "setuptools==83.0.0",
  "twine==6.1.0",
]

[project.scripts]
lumi-trace = "lumi_trace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/skylark-lumi-trace" = [
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "DISCLAIMER.md",
  "README.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
]
"share/skylark-lumi-trace/docs" = [
  "docs/ARCHITECTURE.md",
  "docs/GITHUB_ACTIONS.md",
  "docs/GETTING_STARTED.md",
  "docs/INPUTS_AND_OUTPUTS.md",
  "docs/PRIVACY.md",
  "docs/PRODUCT_SCOPE.md",
  "docs/README.md",
  "docs/REPRODUCTION.md",
  "docs/THREAT_MODEL.md",
]
"share/skylark-lumi-trace/docs/reference" = [
  "docs/reference/SCHEMA_COMPATIBILITY.md",
]
"share/skylark-lumi-trace/schemas" = [
  "schemas/candidate-set-v1.json",
  "schemas/batch-triage-package-v1.json",
  "schemas/evidence-bundle-v1.json",
  "schemas/evidence-package-manifest-v1.json",
  "schemas/localization-inference-request-v0.4.1.json",
  "schemas/localization-raw-ranking-v0.4.1.json",
  "schemas/manual-finding-v1.json",
  "schemas/normalized-finding-collection-v1.json",
  "schemas/normalized-finding-v1.json",
  "schemas/repository-index-v1.json",
  "schemas/reproduction-plan-v1.json",
  "schemas/reproduction-receipt-v1.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "docker: requires a local Linux-container Docker engine and preloaded image",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
